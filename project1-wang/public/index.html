<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 1 - User Account</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f7;
            margin: 0;
            padding: 30px 16px;
        }

        main {
            max-width: 440px;
            margin: auto;
            background: white;
            padding: 28px;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin: 24px 0;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .tabs button {
            flex: 1;
            background: #e8edf5;
            color: #234;
        }

        .tabs button.active {
            background: #205bc2;
            color: white;
        }

        label {
            display: block;
            margin-top: 16px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 16px;
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 24px;
            background: #205bc2;
            color: white;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .message {
            min-height: 24px;
            margin-top: 18px;
        }
    table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 16px;
    font-size: 14px;
}

th, td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: left;
    white-space: nowrap;
}

th {
    background: #e8edf5;
}
    </style>
</head>

<body>
    <main>
        <h1>Project 1</h1>
        <p>User Registration and Sign In</p>

        <!-- switch register and login -->
        <div class="tabs">
            <button
                id="show-register"
                class="active"
                type="button"
                aria-pressed="true"
            >
                Register
            </button>

            <button
                id="show-login"
                type="button"
                aria-pressed="false"
            >
                Sign In
            </button>
        </div>

        <!-- register area -->
        <section id="register-section">
            <h2>Create an Account</h2>

            <form id="register-form">
                <label for="register-username">Username</label>
                <input
                    id="register-username"
                    name="username"
                    type="text"
                    maxlength="50"
                    autocomplete="username"
                    required
                >

                <label for="register-password">Password</label>
                <input
                    id="register-password"
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    required
                >

                <label for="firstname">First Name</label>
                <input
                    id="firstname"
                    name="firstname"
                    type="text"
                    maxlength="50"
                    autocomplete="given-name"
                    required
                >

                <label for="lastname">Last Name</label>
                <input
                    id="lastname"
                    name="lastname"
                    type="text"
                    maxlength="50"
                    autocomplete="family-name"
                    required
                >

                <label for="salary">Salary</label>
                <input
                    id="salary"
                    name="salary"
                    type="number"
                    min="0"
                    max="9999999999.99"
                    step="0.01"
                    required
                >

                <label for="age">Age</label>
                <input
                    id="age"
                    name="age"
                    type="number"
                    min="0"
                    max="150"
                    step="1"
                    required
                >

                <button type="submit">Register</button>
            </form>

            <p
                id="register-message"
                class="message"
                role="status"
                aria-live="polite"
            ></p>
        </section>

        <!-- login area -->
        <section id="login-section" hidden>
            <h2>Sign In</h2>

            <form id="login-form">
                <label for="login-username">Username</label>
                <input
                    id="login-username"
                    name="username"
                    type="text"
                    maxlength="50"
                    autocomplete="username"
                    required
                >

                <label for="login-password">Password</label>
                <input
                    id="login-password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">Sign In</button>
            </form>

            <p
                id="login-message"
                class="message"
                role="status"
                aria-live="polite"
            ></p>
        </section>
    </main>

    <script>
        const registerTab = document.getElementById('show-register');
        const loginTab = document.getElementById('show-login');
        const registerSection = document.getElementById('register-section');
        const loginSection = document.getElementById('login-section');

        const registerForm = document.getElementById('register-form');
        const loginForm = document.getElementById('login-form');

        const registerMessage = document.getElementById('register-message');
        const loginMessage = document.getElementById('login-message');

       
        // show response area according the name
function showPanel(panel) {
    const panels = ['register', 'login'];

    panels.forEach((name) => {
        const section = document.getElementById(name + '-section');
        const tab = document.getElementById('show-' + name);
        const selected = name === panel;

        section.hidden = !selected;
        tab.classList.toggle('active', selected);
        tab.setAttribute('aria-pressed', String(selected));
    });
}

        registerTab.addEventListener('click', () => {
            showPanel('register');
        });

        loginTab.addEventListener('click', () => {
            showPanel('login');
        });

        // the function used by register and signin
        async function sendRequest(url, data) {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const contentType =
                response.headers.get('content-type') || '';

            if (!contentType.includes('application/json')) {
                throw new Error('Unexpected server response');
            }

            const result = await response.json();

            return {
                ok: response.ok,
                result: result
            };
        }

        // manage register
        registerForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const button = registerForm.querySelector(
                'button[type="submit"]'
            );

            button.disabled = true;
            registerMessage.style.color = '#333';
            registerMessage.textContent = 'Registering...';

            const data = {
                username: registerForm.elements.username.value.trim(),
                password: registerForm.elements.password.value,
                firstname: registerForm.elements.firstname.value.trim(),
                lastname: registerForm.elements.lastname.value.trim(),
                salary: Number(registerForm.elements.salary.value),
                age: Number(registerForm.elements.age.value)
            };

            try {
                const { ok, result } = await sendRequest(
                    '/api/register',
                    data
                );

                registerMessage.style.color = ok ? 'green' : 'red';
                registerMessage.textContent = result.message;

                if (ok) {
                    registerForm.reset();

                    // putnew users name in signin table，not copy password
                    loginForm.elements.username.value = data.username;
                    loginForm.elements.password.value = '';
                    loginMessage.textContent = '';
                }
            } catch (error) {
                registerMessage.style.color = 'red';
                registerMessage.textContent =
                    'Unable to register. Check the server.';
            } finally {
                button.disabled = false;
            }
        });

        // manage sign in  
        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const button = loginForm.querySelector(
                'button[type="submit"]'
            );

            button.disabled = true;
            loginMessage.style.color = '#333';
            loginMessage.textContent = 'Signing in...';

            const data = {
                username: loginForm.elements.username.value.trim(),
                password: loginForm.elements.password.value
            };

            try {
                const { ok, result } = await sendRequest(
                    '/api/login',
                    data
                );

                loginMessage.style.color = ok ? 'green' : 'red';

                if (ok) {
                    loginMessage.textContent =
                        result.message + ' Welcome, ' + result.username + '!';

                    loginForm.elements.password.value = '';
                    window.location.assign('/search');
                } else {
                    loginMessage.textContent = result.message;
                } 
            } catch (error) {
                loginMessage.style.color = 'red';
                loginMessage.textContent =
                    'Unable to sign in. Check the server.';
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
